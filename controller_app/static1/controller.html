<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <!-- <meta name="viewport" content="width=device-width,initial-scale=1"> -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape"> 
  <title>Controller</title>
  <link rel="stylesheet" href="controller.css">
  <meta name="theme-color" content="#f3e5c8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <div id="screen-rotate">
    <div id="collumn">

      <div id="controller">
        <!-- Joystick -->
        <div id="joystick"">
          <div  id="joy">
            <div id="stick"></div>
          </div>
        

        <!-- D-Pad (inicialmente escondido) -->
        <div id="dpad">
          <button class="dpad-btn" id="dpad-up"></button>
          <button class="dpad-btn" id="dpad-left"></button>
          <button class="dpad-btn" id="dpad-down"></button>
          <button class="dpad-btn" id="dpad-right"></button>
        </div>
        </div>

        <!-- START e botões A/B -->
        <div id="middle-buttons">
        <div class="checkbox-wrapper-2">Dpad<input type="checkbox" class="sc-gJwTLC ikxBAC" id="modeSwitch" aria-label="Toggle D-Pad/Joystick"></div>
        <div id="status">Conectando...</div>
        <div id="start-select">
          <button class="column3" id="btnSelect"></button>
          <button class="column3" id="btnStart"></button>
        </div>
        </div>
      <div id="buttons">
        <button class="btn column4" id="btnY">y</button>
        <button class="btn column4" id="btnB">b</button>
        <button class="btn column4" id="btnX">x</button>
        <button class="btn column5" id="btnA">a</button>
      </div>
      </div>

    </div>
  </div>
  <script src="controller.js"></script>
</body>

</html>
