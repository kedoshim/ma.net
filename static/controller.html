<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <!-- <meta name="viewport" content="width=device-width,initial-scale=1"> -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
  <title>Controller</title>
  <link rel="stylesheet" href="controller.css">
</head>

<body>
  <div id="collumn">

    <div id="controller">
      <!-- Joystick -->
      <div id="joystick"">
        <div  id="joy">
          <div id="stick"></div>
        </div>
      

      <!-- D-Pad (inicialmente escondido) -->
      <div id="dpad">
        <button class="dpad-btn" id="dpad-up"></button>
        <button class="dpad-btn" id="dpad-left"></button>
        <button class="dpad-btn" id="dpad-down"></button>
        <button class="dpad-btn" id="dpad-right"></button>
      </div>
      </div>

      <!-- START e botões A/B -->
       <div id="middle-buttons">
		   <div class="checkbox-wrapper-2">Dpad<input type="checkbox" class="sc-gJwTLC ikxBAC" id="modeSwitch" aria-label="Toggle D-Pad/Joystick"></div>
		   <div id="status">Conectando...</div>
       <div id="start-select">
         <button class="column3" id="btnSelect"></button>
         <button class="column3" id="btnStart"></button>
       </div>
       </div>
	   <div id="buttons">
		   <button class="btn column4" id="btnY">y</button>
		   <!-- <button class="btn column4" id="btnB">b</button> -->
		   <button class="btn column4" id="btnX">x</button>
		   <button class="btn column5" id="btnA">a</button>
	   </div>
    </div>

    <script src="controller.js"></script>
  </div>
</body>

</html>
